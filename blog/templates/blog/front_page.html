{% extends 'blog_app/landing_page.html'%}
{% load hashid_filters %}
{% block content %}
    <div class="container">
        <div class="row">
            {% if blog_posts %}
                {% for blog in blog_posts %}
                    <div class="col-md-6 mb-5">

                        
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">{{ blog.title }}</h5>
                                <p class="card-text">{{ blog.content }}</p>
                                <p class="card-text"><small class="text-muted">{{ blog.created }}</small></p>
                                <div class="author-info">
                                    <span class="author-name">Published by {{ blog.auther.username }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
{% endblock %}
